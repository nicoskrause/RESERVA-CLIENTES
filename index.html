function openModal(cityName) {
  const c = CITY_IDX[cityName];
  if(!c) return;
  const pc={ativa:'p-ativa',prospect:'p-prospect',inativa:'p-inativa'}[c.s];
  const pt={ativa:'Reserva Ativo',prospect:'Showroom',inativa:'Sem clientes'}[c.s];
  document.getElementById('m-title').innerHTML=`${cityName} <span class="pill ${pc}">${pt}</span>`;
  document.getElementById('m-sub').textContent=`${c.corede||''} • Pop. ${c.pop.toLocaleString('pt-BR')} hab. • ${c.zone||'Zona não classificada'}${c.rzone?' | Zona Reserva: '+c.rzone:''}`;

  let body=`<div class="modal-stats">
    ${c.active.length?`<div class="mstat"><div class="mn" style="color:#276749">${c.active.length}</div><div class="ml">Ativos Reserva</div></div>`:''}
    ${c.prospect.length?`<div class="mstat"><div class="mn" style="color:#553c9a">${c.prospect.length}</div><div class="ml">Showroom</div></div>`:''}
    ${c.fat>0?`<div class="mstat"><div class="mn" style="color:#276749;font-size:.82rem">R$ ${c.fat.toLocaleString('pt-BR')}</div><div class="ml">Fat. Ver.27</div></div>`:''}
    ${c.rzone?`<div class="mstat"><div class="mn" style="color:#4a5568;font-size:.78rem">${c.rzone}</div><div class="ml">Zona Reserva</div></div>`:''}
    <div class="mstat"><div class="mn" style="color:#4a5568;font-size:.82rem">${c.pop.toLocaleString('pt-BR')}</div><div class="ml">Habitantes</div></div>
  </div>`;

  if(c.active.length){
    body+=`<div class="sec-title">✅ Clientes Reserva Ativos <span class="sec-count">${c.active.length}</span></div>`;
    c.active.forEach(cl=>{
      const pedGroup = {};
      cl.pedidos.forEach(p=>{ pedGroup[p.col]=(pedGroup[p.col]||0)+p.val; });
      body+=`<div class="cli-card">
        <div class="cli-name">
          <span>${cl.nome}</span>
          <span class="fat-big">R$ ${cl.fat.toLocaleString('pt-BR')}</span>
        </div>
        ${cl.tipo.length?`<div style="font-size:.69rem;color:#718096;margin-bottom:5px">${cl.tipo.join(' · ')}</div>`:''}
        <div class="pedidos-list">
          ${Object.entries(pedGroup).map(([col,val])=>`
            <div class="pedido-row">
              <span class="pedido-col">📦 ${col}</span>
              <span class="pedido-val">R$ ${val.toLocaleString('pt-BR')}</span>
            </div>`).join('')}
        </div>
      </div>`;
    });
  }
  if(c.prospect.length){
    const withRes = c.prospect.filter(p=>p.hr);
    const others = c.prospect.filter(p=>!p.hr);
    if(withRes.length){
      body+=`<div class="sec-title">🏪 Showroom com Reserva <span class="sec-count">${withRes.length}</span></div>`;
      withRes.forEach(p=>{
        body+=`<div class="prosp-row">
          <span class="prosp-name">${p.nome}</span>
          ${p.seg?`<span class="prosp-seg">${p.seg}</span>`:''}
          <span class="client-tag tag-reserva">Tem Reserva</span>
        </div>`;
      });
    }
    if(others.length){
      const show=others.slice(0,25);
      body+=`<div class="sec-title">🔍 A Prospectar <span class="sec-count">${others.length}</span></div>`;
      show.forEach(p=>{
        body+=`<div class="prosp-row">
          <span class="prosp-name">${p.nome}</span>
          ${p.seg?`<span class="prosp-seg">${p.seg}</span>`:''}
          <span class="client-tag tag-prosp">Prospectar</span>
        </div>`;
      });
      if(others.length>25) body+=`<div style="text-align:center;font-size:.72rem;color:#718096;padding:8px">+ ${others.length-25} mais...</div>`;
    }
  }
  if(!c.active.length&&!c.prospect.length)
    body+=`<div class="empty-msg">Nenhum cliente nesta cidade.</div>`;

  document.getElementById('m-body').innerHTML=body;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){if(e.target===document.getElementById('overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect();});

function tog(id){
  const b=document.getElementById('bd-'+id),t=document.getElementById('tg-'+id);
  if(!b)return; const o=b.classList.toggle('open');t.style.transform=o?'rotate(180deg)':'';
}
function expandAll(){REGIONS.forEach(r=>{const b=document.getElementById('bd-'+r.id);if(b){b.classList.add('open');document.getElementById('tg-'+r.id).style.transform='rotate(180deg)';}});}
function collapseAll(){REGIONS.forEach(r=>{const b=document.getElementById('bd-'+r.id);if(b){b.classList.remove('open');document.getElementById('tg-'+r.id).style.transform='';}});}
function toggleF(type,btn){activeF.has(type)?activeF.delete(type):activeF.add(type);btn.classList.toggle('on');applyF();}
function applyF(){document.querySelectorAll('#main-regiao tbody tr').forEach(tr=>{const s=[...tr.classList].find(c=>c.startsWith('row-'))?.replace('row-','');tr.classList.toggle('hr',!activeF.has(s));});}
function doSearch(q){
  q=q.toLowerCase().trim();
  if(!q){document.querySelectorAll('#main-regiao tbody tr').forEach(tr=>tr.classList.remove('hr'));applyF();return;}
  REGIONS.forEach(r=>{let any=false;const tb=document.getElementById('tb-'+r.id);if(!tb)return;
    tb.querySelectorAll('tr').forEach(tr=>{const m=(tr.dataset.city||'').includes(q);tr.classList.toggle('hr',!m);if(m)any=true;});
    if(any)document.getElementById('bd-'+r.id).classList.add('open');});
}
const first=REGIONS.find(r=>r.nA+r.nP>0);
if(first)tog(first.id);
</script>
</body></html>
